      // ------------------------------------------------------------------
      // MODAL: alege un produs existent (neasignat, nerezervat) din stoc
      // pentru a-l lega de o linie de comandă.
      // ------------------------------------------------------------------
      function renderPickProductModal(l, context, onPick) {
        const overlay = document.createElement("div");
        overlay.id = "pick-produs-overlay";
        overlay.className =
          "fixed inset-0 z-50 flex items-center justify-center px-4 py-8 overflow-y-auto";
        overlay.style.background = "rgba(15,20,25,0.55)";

        // Produsele care se potrivesc exact cerinței liniei (categorie,
        // marcă, culoare) sunt afișate primele în listă — sunt cele mai
        // probabil de ales și corespund mențiunii "Pe stoc".
        const available = stocDisponibilPentruComenzi(context, l.id).sort(
          (a, b) => {
            const am = produsMatchesLinie(a, l) ? 0 : 1;
            const bm = produsMatchesLinie(b, l) ? 0 : 1;
            return am - bm;
          },
        );

        overlay.innerHTML = `
    <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-lg fade-in my-auto">
      <h2 class="text-lg font-bold mb-1">Alege produsul din stoc</h2>
      <p class="text-sm text-slate-500 mb-3">Se cere: ${esc(l.categorie || "—")}${l.marca ? " · " + esc(l.marca) : ""}${l.culoare ? " · " + esc(l.culoare) : ""}</p>
      <input type="text" id="pick-produs-search" class="${inputBase()} mb-3" placeholder="Caută după categorie, marcă, culoare, VIN...">
      <div id="pick-produs-list" class="space-y-1.5 max-h-72 overflow-y-auto"></div>
      <button type="button" id="pick-produs-cancel" class="w-full mt-4 rounded-lg py-2.5 text-sm font-medium border" style="border-color:var(--line)">Anulează</button>
    </div>`;
        document.body.appendChild(overlay);

        document
          .getElementById("pick-produs-cancel")
          .addEventListener("click", () => overlay.remove());
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.remove();
        });

        const listEl = document.getElementById("pick-produs-list");
        function paint(filterQ) {
          const q = (filterQ || "").trim().toLowerCase();
          const filtered = !q
            ? available
            : available.filter((p) =>
                [p.categorie, p.marca, p.culoare, p.vin, p.id_produs]
                  .filter(Boolean)
                  .some((v) => v.toLowerCase().includes(q)),
              );
          if (!filtered.length) {
            listEl.innerHTML = `<p class="text-sm text-slate-400 text-center py-6">Niciun produs disponibil în stoc.</p>`;
            return;
          }
          listEl.innerHTML = filtered
            .map(
              (p) => `
      <button type="button" data-pick="${p.id}" class="pick-produs-item w-full text-left border rounded-lg px-3 py-2 text-sm hover:bg-slate-50" style="border-color:var(--line)">
        <div class="font-medium">${esc(p.categorie || "—")} · ${esc(p.marca || "—")} · ${esc(p.culoare || "—")}</div>
        <div class="text-xs text-slate-400 font-mono">${esc(p.id_produs)}${p.vin ? " · VIN " + esc(p.vin) : ""}</div>
      </button>`,
            )
            .join("");
          listEl.querySelectorAll(".pick-produs-item").forEach((btn) => {
            btn.addEventListener("click", () => {
              const produs = available.find((p) => p.id === btn.dataset.pick);
              overlay.remove();
              onPick(produs);
            });
          });
        }
        paint("");
        document
          .getElementById("pick-produs-search")
          .addEventListener("input", (e) => paint(e.target.value));
      }

      // ------------------------------------------------------------------
      // O linie din detaliul comenzii (varianta editabilă, pentru Admin)
      // ------------------------------------------------------------------
      function comandaLineRow(l, context) {
        const produs = l.produs_id
          ? context.produse.find((p) => p.id === l.produs_id)
          : null;
        // Pentru o linie încă neasignată, dacă există deja un produs
        // potrivit pe stocul central, se afișează "Pe stoc" în loc de
        // "Neasignat" (produsul propriu-zis se leagă tot manual, din
        // "Leagă produs").
        const arePeStoc = !produs && !!findMatchingStockProduct(l, context);
        const statusText = arePeStoc
          ? "Pe stoc"
          : lineStatusLabel(l.status_linie);
        const statusCls = arePeStoc
          ? "text-sky-700"
          : l.status_linie === "trimis"
            ? "text-emerald-700"
            : l.status_linie === "realocat"
              ? "text-red-600"
              : l.status_linie === "asignat"
                ? "text-blue-700"
                : "text-amber-700";
        return `
  <div class="border rounded-lg p-3 flex items-center justify-between gap-3 flex-wrap" style="border-color:var(--line)" data-linie="${l.id}">
    <div class="text-sm">
      <div class="font-medium">${esc(l.categorie || "—")}${l.marca ? " · " + esc(l.marca) : ""}${l.culoare ? " · " + esc(l.culoare) : ""}</div>
      <div class="text-xs text-slate-400">Cantitate: ${l.cantitate}</div>
      ${produs ? `<div class="text-xs text-emerald-700 mt-1">Legat de produsul ${esc(produs.id_produs)}${produs.vin ? " · VIN " + esc(produs.vin) : ""}</div>` : ""}
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs font-medium ${statusCls}">${esc(statusText)}</span>
      ${
        l.status_linie === "trimis"
          ? ""
          : `<button data-link-line="${l.id}" class="rounded-md px-3 py-1.5 text-xs font-semibold border" style="border-color:var(--line)">${produs ? "Schimbă produsul" : "Leagă produs"}</button>
             <button data-newprod-line="${l.id}" class="rounded-md px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200">+ Produs nou</button>
             ${
               l.status_linie === "asignat"
                 ? `<button data-unlink-line="${l.id}" class="rounded-md px-3 py-1.5 text-xs font-semibold border text-amber-700" style="border-color:var(--line)">Anulează legătura</button>`
                 : ""
             }`
      }
    </div>
  </div>`;
      }

      function bindComandaLineRow(l, context, paintLines, overlay, agenti) {
        const row = overlay.querySelector(`[data-linie="${l.id}"]`);
        if (!row) return;
        const linkBtn = row.querySelector(`[data-link-line="${l.id}"]`);
        if (linkBtn) {
          linkBtn.addEventListener("click", () => {
            renderPickProductModal(l, context, async (produs) => {
              await supa
                .from("comanda_produse")
                .update({ produs_id: produs.id, status_linie: "asignat" })
                .eq("id", l.id);
              l.produs_id = produs.id;
              l.status_linie = "asignat";
              paintLines();
            });
          });
        }
        const newProdBtn = row.querySelector(`[data-newprod-line="${l.id}"]`);
        if (newProdBtn) {
          newProdBtn.addEventListener("click", () => {
            renderAddProductModal(
              agenti,
              () => {},
              async (produsNou) => {
                await supa
                  .from("comanda_produse")
                  .update({ produs_id: produsNou.id, status_linie: "asignat" })
                  .eq("id", l.id);
                l.produs_id = produsNou.id;
                l.status_linie = "asignat";
                context.produse.push(produsNou);
                paintLines();
              },
              { categorie: l.categorie, marca: l.marca, culoare: l.culoare },
              distinctMarci(context.produse),
            );
          });
        }
        const unlinkBtn = row.querySelector(`[data-unlink-line="${l.id}"]`);
        if (unlinkBtn) {
          unlinkBtn.addEventListener("click", async () => {
            const ok = confirm(
              "Anulezi legătura acestui produs cu comanda? Produsul va reveni la statusul „Neasignat”.",
            );
            if (!ok) return;
            await supa
              .from("comanda_produse")
              .update({ produs_id: null, status_linie: "neasignat" })
              .eq("id", l.id);
            l.produs_id = null;
            l.status_linie = "neasignat";
            paintLines();
          });
        }
      }

      // ------------------------------------------------------------------
      // MODAL: detaliul unei comenzi, cu drept de editare (Admin/Superadmin)
      // ------------------------------------------------------------------
      function renderComandaDetailModal(c, lines, context, onSaved) {
        const overlay = document.createElement("div");
        overlay.id = "comanda-detail-overlay";
        overlay.className =
          "fixed inset-0 z-40 flex items-center justify-center px-4 py-8 overflow-y-auto";
        overlay.style.background = "rgba(15,20,25,0.55)";

        const m = context.magazine.find((x) => x.id === c.magazin_id);
        const magazinLabel = m
          ? `${m.nume || m.email}${m.filiala ? " - " + m.filiala : ""}`
          : c.vanzare_directa
            ? "Vânzare directă"
            : "—";

        overlay.innerHTML = `
    <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-3xl fade-in my-auto">
      <div class="flex items-start justify-between mb-1">
        <h2 class="text-lg font-bold">${esc(c.numar_comanda)}</h2>
        <button id="comanda-detail-close" class="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
      </div>
      <p class="text-sm text-slate-500 mb-1">Magazin: <strong>${esc(magazinLabel)}</strong> · Agent: ${esc(c.agent || "—")}</p>
      ${c.observatii ? `<p class="text-xs text-slate-400 mb-3">Observații: ${esc(c.observatii)}</p>` : ""}
      <div id="comanda-lines-detail" class="space-y-2 my-4"></div>
      <div class="flex gap-2 pt-2 border-t flex-wrap" style="border-color:var(--line)">
        <button id="comanda-anuleaza" class="rounded-lg py-2.5 px-4 text-sm font-medium border text-red-600" style="border-color:var(--line)">Anulează comanda</button>
        ${
          currentProfile.role === "superadmin"
            ? `<button id="comanda-sterge" class="rounded-lg py-2.5 px-4 text-sm font-medium border text-red-700" style="border-color:var(--line)">Șterge definitiv</button>`
            : c.stergere_ceruta
              ? `<button disabled class="rounded-lg py-2.5 px-4 text-sm font-medium border text-slate-400" style="border-color:var(--line)">Ștergere solicitată</button>`
              : `<button id="comanda-cere-stergere" class="rounded-lg py-2.5 px-4 text-sm font-medium border text-red-600" style="border-color:var(--line)">Solicită ștergere</button>`
        }
        <button id="comanda-trimite" class="ml-auto btn-primary rounded-lg py-2.5 px-5 text-sm">Trimite produsele pregătite</button>
      </div>
      <p id="comanda-detail-msg" class="text-sm text-center mt-2"></p>
    </div>`;
        document.body.appendChild(overlay);

        document
          .getElementById("comanda-detail-close")
          .addEventListener("click", () => overlay.remove());
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.remove();
        });

        const linesEl = document.getElementById("comanda-lines-detail");
        function paintLines() {
          linesEl.innerHTML = lines
            .map((l) => comandaLineRow(l, context))
            .join("");
          lines.forEach((l) =>
            bindComandaLineRow(l, context, paintLines, overlay, context.agenti),
          );
        }
        paintLines();

        document
          .getElementById("comanda-trimite")
          .addEventListener("click", async () => {
            const readyLines = lines.filter(
              (l) => l.status_linie === "asignat",
            );
            const msg = document.getElementById("comanda-detail-msg");
            if (!readyLines.length) {
              msg.className = "text-sm text-center text-red-600";
              msg.textContent = "Nu există produse pregătite de trimis.";
              return;
            }
            const btn = document.getElementById("comanda-trimite");
            btn.disabled = true;
            btn.textContent = "Se trimite...";

            for (const l of readyLines) {
              const produs = context.produse.find((p) => p.id === l.produs_id);
              if (!produs) continue;
              const payload = {
                magazin_id: c.magazin_id,
                agent: c.agent,
                telefon: m ? m.telefon || null : null,
                adresa_facturare: m ? m.adresa_facturare || null : null,
                vanzare_directa: !!c.vanzare_directa,
                updated_at: new Date().toISOString(),
              };
              if (!produs.data_comenzii) {
                payload.data_comenzii = new Date().toISOString().slice(0, 10);
              }
              await supa.from("produse").update(payload).eq("id", produs.id);
              await supa
                .from("comanda_produse")
                .update({ status_linie: "trimis" })
                .eq("id", l.id);
              l.status_linie = "trimis";
              Object.assign(produs, payload);
            }

            const newStatus = computeComandaStatus(lines);
            await supa
              .from("comenzi")
              .update({
                status: newStatus,
                updated_at: new Date().toISOString(),
              })
              .eq("id", c.id);

            toast("Produsele pregătite au fost trimise către magazin.");
            overlay.remove();
            onSaved();
          });

        document
          .getElementById("comanda-anuleaza")
          .addEventListener("click", async () => {
            const ok = confirm(`Anulezi definitiv comanda ${c.numar_comanda}?`);
            if (!ok) return;
            await supa
              .from("comenzi")
              .update({
                status: "anulata",
                updated_at: new Date().toISOString(),
              })
              .eq("id", c.id);
            toast("Comanda a fost anulată.");
            overlay.remove();
            onSaved();
          });

        // Super admin: ștergere definitivă imediată, cu dublă confirmare.
        const btnSterge = document.getElementById("comanda-sterge");
        if (btnSterge) {
          btnSterge.addEventListener("click", async () => {
            const ok1 = confirm(
              `Ești sigur că vrei să ștergi definitiv comanda ${c.numar_comanda}? Această acțiune nu poate fi anulată.`,
            );
            if (!ok1) return;
            const ok2 = confirm(
              "Confirmă din nou: comanda și toate liniile ei vor fi șterse definitiv.",
            );
            if (!ok2) return;
            await supa.from("comanda_produse").delete().eq("comanda_id", c.id);
            await supa.from("comenzi").delete().eq("id", c.id);
            toast("Comanda a fost ștearsă definitiv.");
            overlay.remove();
            onSaved();
          });
        }

        // Admin: doar solicită ștergerea; devine efectivă abia după
        // aprobarea unui Super admin, din tab-ul "Aprobări".
        const btnCereStergere = document.getElementById(
          "comanda-cere-stergere",
        );
        if (btnCereStergere) {
          btnCereStergere.addEventListener("click", async () => {
            const ok = confirm(
              `Soliciți ștergerea comenzii ${c.numar_comanda}? Cererea va fi trimisă spre aprobare unui Super admin.`,
            );
            if (!ok) return;
            await supa
              .from("comenzi")
              .update({
                stergere_ceruta: true,
                stergere_ceruta_de: currentProfile.nume || currentProfile.email,
                stergere_ceruta_la: new Date().toISOString(),
              })
              .eq("id", c.id);
            toast("Solicitarea de ștergere a fost trimisă spre aprobare.");
            overlay.remove();
            onSaved();
          });
        }
      }

      // ------------------------------------------------------------------
      // TAB "Comenzi" — Admin / Superadmin (management complet)
      // ------------------------------------------------------------------
      async function renderComenziAdmin(container) {
        container.innerHTML = `<div class="text-sm text-slate-400">Se încarcă...</div>`;

        const [
          { data: comenzi, error: comErr },
          { data: linii, error: liniiErr },
          { data: profiles, error: profErr },
          { data: produse, error: prodErr },
        ] = await Promise.all([
          supa
            .from("comenzi")
            .select("*")
            .order("created_at", { ascending: false }),
          supa.from("comanda_produse").select("*"),
          supa.from("profiles").select("*"),
          supa.from("produse").select("*"),
        ]);

        if (comErr || liniiErr || profErr || prodErr) {
          const e = comErr || liniiErr || profErr || prodErr;
          container.innerHTML = `<div class="text-red-600 text-sm">Eroare la încărcare: ${esc(e.message)}</div>`;
          return;
        }

        const magazine = (profiles || []).filter((p) => p.role === "magazin");
        const agenti = (profiles || []).filter((p) => p.role === "agent");
        const context = {
          magazine,
          agenti,
          allLinii: linii || [],
          produse: produse || [],
          marci: distinctMarci([...(produse || []), ...(linii || [])]),
          marcaCategorieMap: buildMarcaCategorieMap(produse || []),
        };

        container.innerHTML = `
    <div class="mb-4 flex items-center justify-between gap-3 flex-wrap">
      <p class="text-sm text-slate-500">${(comenzi || []).length} ${(comenzi || []).length === 1 ? "comandă" : "comenzi"}</p>

          });
        }

        if (deleteBtn && !deleteBtn.disabled) {
          deleteBtn.addEventListener("click", async () => {
            const lockedForViewer =
              p.role === "superadmin" && !viewerIsSuperadmin;
            if (lockedForViewer) {
              toast(
                "Doar un super admin poate șterge un cont de super admin.",
                true,
              );
              return;
            }
            const ok = confirm(
              `Ștergi definitiv contul ${p.email}? Acțiunea nu poate fi anulată.`,
            );
            if (!ok) return;

            deleteBtn.disabled = true;
            deleteBtn.textContent = "Se șterge...";
            const { data, error } = await supa.functions.invoke("delete-user", {
              body: { target_id: p.id },
            });
            const errMsg = error?.message || data?.error;
            if (errMsg) {
              toast("Eroare la ștergere: " + errMsg, true);
              deleteBtn.disabled = false;
              deleteBtn.textContent = "Șterge cont";
              return;
            }
            toast("Cont șters definitiv.");
            row.remove();
          });
        }

        roleSelect.addEventListener("change", () => {
          const role = roleSelect.value;
          numeInput.disabled = !role;
          telefonInput.disabled = !role;
          filialaInput.disabled = role !== "magazin";
          if (role === "agent")
            magBox.classList.remove("opacity-30", "pointer-events-none");
          else magBox.classList.add("opacity-30", "pointer-events-none");
        });

        row.querySelector(".save-btn").addEventListener("click", async () => {
          const btn = row.querySelector(".save-btn");

          if (p.role === "superadmin" && !viewerIsSuperadmin) {
            toast(
              "Doar un super admin poate modifica rolul unui super admin.",
              true,
            );
            return;
          }
          if (roleSelect.value === "superadmin" && !viewerIsSuperadmin) {
            toast(
              "Doar un super admin poate acorda rolul de super admin.",
              true,
            );
            return;
          }

          btn.disabled = true;
          btn.textContent = "Se salvează...";

          const role = roleSelect.value || null;
          const nume = numeInput.value.trim() || null;
          const telefon = telefonInput.value.trim() || null;
          const filiala = filialaInput.value.trim() || null;

          const { error: upErr } = await supa
            .from("profiles")
            .update({
              role,
              nume,
              telefon,
              filiala,
              updated_at: new Date().toISOString(),
            })
            .eq("id", p.id);

          if (upErr) {
            toast("Eroare: " + upErr.message, true);
            btn.disabled = false;
            btn.textContent = "Salvează";
            return;
          }

          if (role === "agent") {
            const checked = Array.from(
              row.querySelectorAll(".mag-check:checked"),
            ).map((c) => c.dataset.magazinId);
            await supa.from("agent_magazine").delete().eq("agent_id", p.id);
            if (checked.length) {
              const rows = checked.map((magId) => ({
                agent_id: p.id,
                magazin_id: magId,
              }));
              const { error: linkErr } = await supa
                .from("agent_magazine")
                .insert(rows);
              if (linkErr)
                toast(
                  "Eroare la alocarea magazinelor: " + linkErr.message,
                  true,
                );
            }
          }

          toast("Salvat cu succes.");
          btn.disabled = false;
          btn.textContent = "Salvează";
        });
      }

      // ==================================================================
      // FEATURE: Încărcare baterii — ciclu obligatoriu de max. 15 zile,
      // per produs aflat în stocul unui magazin (magazin_id setat).
      // Funcționalitate 100% aditivă: un tabel Supabase nou
      // (`incarcari_baterie`) + un tab nou de navigare per rol. Nu
      // modifică nicio structură/funcție/tabel existent din aplicație.
      //
      // Reguli:
      // - Ancora ciclului = produse.data_comenzii (data intrării în
      //   stocul magazinului curent); la realocare, data_comenzii se
      //   actualizează deja în cod, deci ancora se resetează automat.
      // - Fiecare încărcare trebuie să se producă în max. 15 zile de la
      //   ancoră (sau de la încărcarea anterioară) — altfel e permisă,
      //   dar marcată roșu (întârziată). La timp = verde.
      // - Doar rolul "magazin" poate înregistra o încărcare (butonul
      //   apare doar la el); agent și admin/superadmin văd totul
      //   read-only (status curent + istoric complet).
      // - Ciclul se oprește automat când produsul iese din stocul unui
      //   magazin (magazin_id golit la retragere) — nu mai apare în
      //   listă. Când va exista funcția "vânzare stoc" către clientul
      //   final, ea trebuie doar să golească/marcheze produsul în mod
      //   similar, ca acesta să dispară automat și din această listă.
      //
      // Migrare SQL necesară (o singură dată, în Supabase SQL editor):
      //
      //   create table incarcari_baterie (
      //     id bigint generated always as identity primary key,
      //     produs_id uuid not null references produse(id) on delete cascade,
      //     data_incarcare date not null,
      //     inregistrat_de uuid references profiles(id),
      //     observatii text,
      //     created_at timestamptz not null default now()
      //   );
      //   alter table incarcari_baterie enable row level security;
      //
      //   create policy "magazin insert propriile incarcari"
      //     on incarcari_baterie for insert
      //     with check (
      //       exists (select 1 from produse p where p.id = produs_id and p.magazin_id = auth.uid())
      //     );
      //   create policy "magazin select propriile incarcari"
      //     on incarcari_baterie for select
      //     using (
      //       exists (select 1 from produse p where p.id = produs_id and p.magazin_id = auth.uid())
      //     );
      //   create policy "agent select incarcari magazine alocate"
      //     on incarcari_baterie for select
      //     using (
      //       exists (
      //         select 1 from produse p
      //         join agent_magazine am on am.magazin_id = p.magazin_id
      //         where p.id = produs_id and am.agent_id = auth.uid()
      //       )
      //     );
      //   create policy "admin superadmin select toate incarcarile"
      //     on incarcari_baterie for select
      //     using (
      //       exists (
      //         select 1 from profiles pr where pr.id = auth.uid()
      //         and pr.role in ('admin','superadmin')
      //       )
      //     );
      // ==================================================================

      const ZILE_CICLU_BATERIE = 15;

      function adaugaZileData(dataISO, zile) {
        const d = new Date(dataISO + "T00:00:00");
        d.setDate(d.getDate() + zile);
        return d.toISOString().slice(0, 10);
      }

      function astaziISO() {
        return new Date().toISOString().slice(0, 10);
      }

      function diferentaZile(dataA, dataB) {
        const a = new Date(dataA + "T00:00:00");
        const b = new Date(dataB + "T00:00:00");
        return Math.round((a - b) / 86400000);
      }

      // Calculează ciclurile de încărcare deja încheiate + starea
      // ciclului curent pentru un produs aflat în stocul unui magazin.
      // Returnează null dacă produsul nu e (încă) la un magazin.
      function calculeazaCicluriBaterie(produs, toateIncarcarile) {
        if (!produs.magazin_id || !produs.data_comenzii) return null;

        const ancoraStart = produs.data_comenzii.slice(0, 10);
        const incarcariProdus = (toateIncarcarile || [])
          .filter(
            (i) => i.produs_id === produs.id && i.data_incarcare >= ancoraStart,
          )
          .sort((a, b) => a.data_incarcare.localeCompare(b.data_incarcare));

        const cicluri = [];
        let ancoraCurenta = ancoraStart;
        incarcariProdus.forEach((inc) => {
          const termen = adaugaZileData(ancoraCurenta, ZILE_CICLU_BATERIE);
          const status = inc.data_incarcare <= termen ? "verde" : "rosu";
          cicluri.push({ ...inc, ancora: ancoraCurenta, termen, status });
          ancoraCurenta = inc.data_incarcare;
        });

        const termenCurent = adaugaZileData(ancoraCurenta, ZILE_CICLU_BATERIE);
        const zileDiff = diferentaZile(termenCurent, astaziISO());
        const statusCurent = zileDiff >= 0 ? "verde" : "rosu";

        return {
          ancoraStart,
          cicluri,
          ancoraCurenta,
          termenCurent,
          statusCurent,
          zileDiff,
        };
      }

      function bateriiStatusBadge(statusCurent, zileDiff) {
        if (statusCurent === "rosu") {
          const zz = Math.abs(zileDiff);
          return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-red-50 text-red-600">🔴 Depășit cu ${zz} zi${zz === 1 ? "" : "le"}</span>`;
        }
        return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700">🟢 În termen (${zileDiff} zi${zileDiff === 1 ? "" : "le"} rămase)</span>`;
      }

      function rezumatBaterii(produse, incarcari) {
        let inTermen = 0;
        let depasite = 0;
        (produse || []).forEach((p) => {
          const c = calculeazaCicluriBaterie(p, incarcari);
          if (!c) return;
          if (c.statusCurent === "rosu") depasite++;
          else inTermen++;
        });
        return { inTermen, depasite, total: inTermen + depasite };
      }

      function bateriiRezumatBar(produse, incarcari) {
        const { inTermen, depasite, total } = rezumatBaterii(
          produse,
          incarcari,
        );
        return `
    <div class="flex flex-wrap items-center gap-3 mb-4">
      <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium bg-white border" style="border-color:var(--line)">
        📦 ${total} produs${total === 1 ? "" : "e"} de urmărit
      </span>
      <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium bg-emerald-50 text-emerald-700">
        🟢 ${inTermen} în termen
      </span>
      <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium ${depasite > 0 ? "bg-red-50 text-red-600" : "bg-slate-50 text-slate-400"}">
        🔴 ${depasite} cu termen depășit
      </span>
    </div>`;
      }

      // Modal simplu de identificare a produsului (categorie, marcă,
      // culoare, VIN) — deschis la click pe ID-ul produsului, în toate
      // cele 3 vederi, pentru identificare rapidă fără a părăsi tab-ul.
      function renderIdentificaProdusModal(produs) {
        const overlay = document.createElement("div");
        overlay.id = "identifica-produs-overlay";
        overlay.className =
          "fixed inset-0 z-40 flex items-center justify-center px-4 py-8 overflow-y-auto";
        overlay.style.background = "rgba(15,20,25,0.55)";

        overlay.innerHTML = `
    <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm fade-in my-auto">
      <div class="flex items-start justify-between mb-3">
        <h2 class="text-lg font-bold font-mono">${esc(produs.id_produs)}</h2>
        <button id="identifica-produs-close" class="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
      </div>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between border-b pb-2" style="border-color:var(--line)"><span class="text-slate-400">Categorie</span><span class="font-medium">${esc(produs.categorie || "—")}</span></div>
        <div class="flex justify-between border-b pb-2" style="border-color:var(--line)"><span class="text-slate-400">Marcă</span><span class="font-medium">${esc(produs.marca || "—")}</span></div>
        <div class="flex justify-between border-b pb-2" style="border-color:var(--line)"><span class="text-slate-400">Culoare</span><span class="font-medium">${esc(produs.culoare || "—")}</span></div>
        <div class="flex justify-between pb-1"><span class="text-slate-400">VIN</span><span class="font-medium font-mono">${esc(produs.vin || "—")}</span></div>
      </div>
    </div>`;
        document.body.appendChild(overlay);
        document
          .getElementById("identifica-produs-close")
          .addEventListener("click", () => overlay.remove());
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.remove();
        });
      }

      // Modal cu istoricul complet al încărcărilor unui produs (comun
      // pentru toate cele 3 vederi — magazin, agent, admin/superadmin).
      function renderIstoricBaterieModal(produs, cicluInfo) {
        const overlay = document.createElement("div");
        overlay.id = "istoric-baterie-overlay";
        overlay.className =
          "fixed inset-0 z-40 flex items-center justify-center px-4 py-8 overflow-y-auto";
        overlay.style.background = "rgba(15,20,25,0.55)";

        const randuriIstoric = cicluInfo.cicluri.length
          ? cicluInfo.cicluri
              .slice()
              .reverse()
              .map(
                (c) => `
        <div class="border rounded-lg p-3 flex items-center justify-between gap-3" style="border-color:var(--line)">
          <div class="text-sm">
            <div class="font-medium">${new Date(c.data_incarcare).toLocaleDateString("ro-RO")}</div>
            <div class="text-xs text-slate-400">Ciclu pornit ${new Date(c.ancora).toLocaleDateString("ro-RO")} · termen ${new Date(c.termen).toLocaleDateString("ro-RO")}</div>
          </div>
          ${c.status === "verde" ? `<span class="text-xs font-semibold text-emerald-700">🟢 În termen</span>` : `<span class="text-xs font-semibold text-red-600">🔴 Întârziat</span>`}
        </div>`,
              )
              .join("")
          : `<p class="text-sm text-slate-400 text-center py-4">Nicio încărcare înregistrată încă pentru ciclul curent.</p>`;

        overlay.innerHTML = `
    <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-md fade-in my-auto">
      <div class="flex items-start justify-between mb-1">
        <h2 class="text-lg font-bold">Istoric încărcări — ${esc(produs.id_produs)}</h2>
        <button id="istoric-baterie-close" class="text-slate-400 hover:text-slate-600 text-xl leading-none">✕</button>
      </div>
      <p class="text-sm text-slate-500 mb-3">Ciclu curent: pornit ${new Date(cicluInfo.ancoraCurenta).toLocaleDateString("ro-RO")} · termen ${new Date(cicluInfo.termenCurent).toLocaleDateString("ro-RO")}</p>
      <div class="mb-3">${bateriiStatusBadge(cicluInfo.statusCurent, cicluInfo.zileDiff)}</div>
      <div class="space-y-2 max-h-80 overflow-y-auto">${randuriIstoric}</div>
    </div>`;
        document.body.appendChild(overlay);
        document
          .getElementById("istoric-baterie-close")
          .addEventListener("click", () => overlay.remove());
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.remove();
        });
      }

      // Tabel comun pentru cele 3 vederi. `permiteIncarcare` afișează
      // butonul de înregistrare a unei încărcări noi (doar la magazin).
      // `arataMagazin` adaugă coloana cu numele magazinului (agent/admin).
      function renderBateriiTable(
        produse,
        incarcari,
        permiteIncarcare,
        arataMagazin,
        magazine,
      ) {
        if (!produse.length) {
          return `<div class="bg-white rounded-xl border p-10 text-center" style="border-color:var(--line)"><p class="text-slate-400 text-sm">Niciun produs de urmărit momentan.</p></div>`;
        }
        return `
    <div class="bg-white rounded-xl border overflow-x-auto" style="border-color:var(--line)">
      <table class="w-full text-sm min-w-[900px]">
        <thead>
          <tr class="text-left text-slate-500 border-b" style="border-color:var(--line)">
            <th class="px-3 py-3 font-medium">Nr.</th>
            <th class="px-3 py-3 font-medium">ID produs</th>
            ${arataMagazin ? `<th class="px-3 py-3 font-medium">Magazin</th>` : ""}
            <th class="px-3 py-3 font-medium">Intrare în stoc</th>
            <th class="px-3 py-3 font-medium">Status încărcare</th>
            <th class="px-3 py-3 font-medium">Ultima încărcare</th>
            <th class="px-3 py-3 font-medium"></th>
          </tr>
        </thead>
        <tbody>${produse
          .map((p, i) => {
            const c = calculeazaCicluriBaterie(p, incarcari);
            if (!c) return "";
            const ultima = c.cicluri.length
              ? c.cicluri[c.cicluri.length - 1].data_incarcare
              : null;
            let magazinLabel = "";
            if (arataMagazin) {
              const m = (magazine || []).find((x) => x.id === p.magazin_id);
              magazinLabel = m
                ? `${m.nume || m.email}${m.filiala ? " - " + m.filiala : ""}`
                : "—";
            }
            return `
          <tr class="border-b last:border-0" style="border-color:var(--line)">
            <td class="px-3 py-3 text-slate-400">${i + 1}</td>
            <td class="px-3 py-3 font-mono text-xs"><button type="button" data-identifica-produs="${p.id}" class="underline decoration-dotted hover:text-[var(--teal-dark)]">${esc(p.id_produs)}</button></td>
            ${arataMagazin ? `<td class="px-3 py-3 text-xs">${esc(magazinLabel)}</td>` : ""}
            <td class="px-3 py-3 text-xs text-slate-500">${new Date(p.data_comenzii).toLocaleDateString("ro-RO")}</td>
            <td class="px-3 py-3">${bateriiStatusBadge(c.statusCurent, c.zileDiff)}</td>
            <td class="px-3 py-3 text-xs text-slate-500">${ultima ? new Date(ultima).toLocaleDateString("ro-RO") : "—"}</td>
            <td class="px-3 py-3 text-right whitespace-nowrap">
              <button type="button" data-istoric-produs="${p.id}" class="text-xs font-medium text-slate-500 hover:text-[var(--teal-dark)] underline decoration-dotted mr-3">Istoric</button>
              ${permiteIncarcare ? `<button type="button" data-incarca-produs="${p.id}" class="btn-primary rounded-lg px-3 py-1.5 text-xs">Marchează încărcare azi</button>` : ""}
            </td>
          </tr>`;
          })
          .join("")}</tbody>
      </table>
    </div>`;
      }

      // Leagă evenimentele (istoric +, opțional, marchează încărcare)
      // pentru toate rândurile din tabelul randat de renderBateriiTable.
      function bindBateriiTableEvents(
        container,
        produse,
        incarcari,
        onIncarcare,
      ) {
        produse.forEach((p) => {
          const c = calculeazaCicluriBaterie(p, incarcari);
          if (!c) return;
          const identificaBtn = container.querySelector(
            `[data-identifica-produs="${p.id}"]`,
          );
          if (identificaBtn) {
            identificaBtn.addEventListener("click", () =>
              renderIdentificaProdusModal(p),
            );
          }
          const istoricBtn = container.querySelector(
            `[data-istoric-produs="${p.id}"]`,
          );
          if (istoricBtn) {
            istoricBtn.addEventListener("click", () =>
              renderIstoricBaterieModal(p, c),
            );
          }
          if (onIncarcare) {
            const incarcaBtn = container.querySelector(
              `[data-incarca-produs="${p.id}"]`,
            );
            if (incarcaBtn) {
              incarcaBtn.addEventListener("click", () =>
                onIncarcare(p, incarcaBtn),
              );
            }
          }
        });
      }

      // ------------------------------------------------------------------
      // TAB "Încărcare baterii" — dispatcher pe rol.
      // ------------------------------------------------------------------
      function renderBateriiTab(container) {
        if (currentProfile.role === "magazin")
          return renderBateriiMagazin(container);
        if (currentProfile.role === "agent")
          return renderBateriiAgent(container);
        return renderBateriiAdmin(container);
      }

      // Magazin: doar produsele proprii, cu buton de înregistrare a
      // încărcării de azi.
      async function renderBateriiMagazin(container) {
        container.innerHTML = `<div class="text-sm text-slate-400">Se încarcă...</div>`;
        const { data: produse, error } = await supa
          .from("produse")
          .select("*")
          .eq("magazin_id", currentUser.id)
          .order("created_at", { ascending: true });
        if (error) {
          container.innerHTML = `<div class="text-red-600 text-sm">Eroare: ${esc(error.message)}</div>`;
          return;
        }
        const produsIds = (produse || []).map((p) => p.id);
        const { data: incarcari, error: incErr } = produsIds.length
          ? await supa
              .from("incarcari_baterie")
              .select("*")
              .in("produs_id", produsIds)
          : { data: [] };
        if (incErr) {
          container.innerHTML = `<div class="text-red-600 text-sm">Eroare la încărcarea istoricului: ${esc(incErr.message)}</div>`;
          return;
        }

        container.innerHTML = `
    <p class="text-sm text-slate-500 mb-3">Fiecare produs trebuie încărcat cel târziu la ${ZILE_CICLU_BATERIE} zile de la intrarea în stoc sau de la ultima încărcare.</p>
    ${bateriiRezumatBar(produse || [], incarcari || [])}
    ${renderBateriiTable(produse || [], incarcari || [], true, false, null)}`;

        bindBateriiTableEvents(
          container,
          produse || [],
          incarcari || [],
          async (p, btn) => {
            btn.disabled = true;
            btn.textContent = "Se salvează...";
            const { error: insErr } = await supa
              .from("incarcari_baterie")
              .insert({
                produs_id: p.id,
                data_incarcare: astaziISO(),
                inregistrat_de: currentUser.id,
              });
            if (insErr) {
              toast(
                "Eroare la înregistrarea încărcării: " + insErr.message,
                true,
              );
              btn.disabled = false;
              btn.textContent = "Marchează încărcare azi";
              return;
            }
            toast("Încărcare înregistrată.");
            renderBateriiMagazin(container);
          },
        );
      }

      // Agent: read-only, produsele din magazinele alocate lui.
      async function renderBateriiAgent(container) {
        container.innerHTML = `<div class="text-sm text-slate-400">Se încarcă...</div>`;
        const [
          { data: asocieri, error: asoErr },
          { data: profiles, error: profErr },
        ] = await Promise.all([
          supa
            .from("agent_magazine")
            .select("*")
            .eq("agent_id", currentUser.id),
          supa.from("profiles").select("*"),
        ]);
        if (asoErr || profErr) {
          const e = asoErr || profErr;
          container.innerHTML = `<div class="text-red-600 text-sm">Eroare: ${esc(e.message)}</div>`;
          return;
        }
        const magazinIds = (asocieri || []).map((a) => a.magazin_id);
        const magazine = (profiles || []).filter((p) =>
          magazinIds.includes(p.id),
        );
        if (!magazine.length) {
          container.innerHTML = `<div class="bg-white rounded-xl border p-10 text-center" style="border-color:var(--line)"><p class="text-slate-400 text-sm">Nu ai niciun magazin alocat.</p></div>`;
          return;
        }
        const { data: produse, error: prodErr } = await supa
          .from("produse")
          .select("*")
          .in("magazin_id", magazinIds)
          .order("created_at", { ascending: true });
        if (prodErr) {
          container.innerHTML = `<div class="text-red-600 text-sm">Eroare: ${esc(prodErr.message)}</div>`;
          return;
        }
        const produsIds = (produse || []).map((p) => p.id);
        const { data: incarcari, error: incErr } = produsIds.length
          ? await supa
              .from("incarcari_baterie")
              .select("*")
              .in("produs_id", produsIds)
          : { data: [] };
        if (incErr) {
          container.innerHTML = `<div class="text-red-600 text-sm">Eroare la încărcarea istoricului: ${esc(incErr.message)}</div>`;
          return;
        }

        container.innerHTML = `
    ${bateriiRezumatBar(produse || [], incarcari || [])}
    ${renderBateriiTable(produse || [], incarcari || [], false, true, magazine)}`;

        bindBateriiTableEvents(container, produse || [], incarcari || []);
      }

      // Admin / Superadmin: read-only, toate produsele aflate la orice
      // magazin (magazin_id setat).
      async function renderBateriiAdmin(container) {
        container.innerHTML = `<div class="text-sm text-slate-400">Se încarcă...</div>`;
        const [
          { data: produse, error: prodErr },
          { data: profiles, error: profErr },
        ] = await Promise.all([
          supa
            .from("produse")
            .select("*")
            .not("magazin_id", "is", null)
            .order("created_at", { ascending: true }),
          supa.from("profiles").select("*"),
        ]);
        if (prodErr || profErr) {
          const e = prodErr || profErr;
          container.innerHTML = `<div class="text-red-600 text-sm">Eroare: ${esc(e.message)}</div>`;
          return;
        }
        const magazine = (profiles || []).filter((p) => p.role === "magazin");
        const produsIds = (produse || []).map((p) => p.id);
        const { data: incarcari, error: incErr } = produsIds.length
          ? await supa
              .from("incarcari_baterie")
              .select("*")
              .in("produs_id", produsIds)
          : { data: [] };
        if (incErr) {
          container.innerHTML = `<div class="text-red-600 text-sm">Eroare la încărcarea istoricului: ${esc(incErr.message)}</div>`;
          return;
        }

        container.innerHTML = `
    ${bateriiRezumatBar(produse || [], incarcari || [])}
    ${renderBateriiTable(produse || [], incarcari || [], false, true, magazine)}`;

        bindBateriiTableEvents(container, produse || [], incarcari || []);
      }

      // ==================================================================
      // FEATURE: Vânzare produs către client final — magazinele își vând
      // produsele din stocul propriu, iar admin/superadmin pot vinde
      // produsele marcate "Vânzare directă". Funcționalitate 100%
      // aditivă: coloane noi pe `produse` + un bucket nou de Storage +
      // un tab nou de navigare per rol. Nu modifică nicio structură de
      // date sau funcție existentă din aplicație.
      //
      // Reguli:
      // - Poate iniția vânzarea: rolul "magazin" pentru produsele din
      //   propriul stoc (magazin_id = auth.uid()), respectiv
      //   admin/superadmin pentru produsele cu vanzare_directa = true.
      // - La salvare se cer: Nume Prenume, Adresă, Telefon, Email,
      //   fișier Factură, fișier P.V. de predare (ambele obligatorii) și,
      //   dacă bifează "Garanție extinsă", și fișierul de Garanție
      //   extinsă.
      // - Produsul vândut (vandut = true) dispare automat din listele de
      //   stoc (Stocul meu / Depozit central - Produse trimise) și apare
      //   în tab-ul nou "Produse vândute".
      // - Magazinul vede doar propriile vânzări; admin/superadmin văd
      //   toate vânzările (din toate magazinele + vânzările directe) și
      //   pot deschide fișierele încărcate. Agentul nu are acces la acest
      //   tab.
      //
      // Migrare SQL necesară (o singură dată, în Supabase SQL editor):
      //
      //   alter table produse add column vandut boolean not null default false;
      //   alter table produse add column data_vanzare timestamptz;
      //   alter table produse add column vandut_de uuid references profiles(id);
      //   alter table produse add column client_nume text;
      //   alter table produse add column client_adresa text;
      //   alter table produse add column client_telefon text;
      //   alter table produse add column client_email text;
      //   alter table produse add column garantie_extinsa boolean not null default false;
      //   alter table produse add column factura_url text;
      //   alter table produse add column pv_predare_url text;
      //   alter table produse add column garantie_extinsa_url text;
      //
      //   -- Bucket nou de Storage (privat), creat din Supabase Dashboard
      //   -- sau via SQL: insert into storage.buckets (id, name, public)
      //   -- values ('documente-vanzari', 'documente-vanzari', false);
      //
      //   create policy "upload documente vanzari"
      //     on storage.objects for insert
      //     with check (
      //       bucket_id = 'documente-vanzari' and (
      //         exists (
      //           select 1 from produse p
      //           where p.id::text = (storage.foldername(name))[1]
      //           and p.magazin_id = auth.uid()
      //         )
      //         or exists (
      //           select 1 from profiles pr where pr.id = auth.uid()
      //           and pr.role in ('admin','superadmin')
      //         )
      //       )
      //     );
      //   create policy "select documente vanzari"
      //     on storage.objects for select
      //     using (
      //       bucket_id = 'documente-vanzari' and (
      //         exists (
      //           select 1 from produse p
      //           where p.id::text = (storage.foldername(name))[1]
      //           and p.magazin_id = auth.uid()
      //         )
      //         or exists (
      //           select 1 from profiles pr where pr.id = auth.uid()
      //           and pr.role in ('admin','superadmin')
      //         )
      //       )
      //     );
      // ==================================================================

      const BUCKET_VANZARI = "documente-vanzari";

      // Încarcă un fișier în bucketul privat de documente de vânzare, sub
      // folderul produsului (produs_id), cu un nume unic. Returnează
      // path-ul salvat în Storage (nu URL public — bucketul e privat).
      async function incarcaDocumentVanzare(produsId, file, tip) {
        const extensie = (file.name.split(".").pop() || "bin").toLowerCase();
        const path = `${produsId}/${tip}_${Date.now()}.${extensie}`;
        const { error } = await supa.storage
          .from(BUCKET_VANZARI)
          .upload(path, file, { upsert: true, contentType: file.type });
        if (error) throw error;
        return path;
      }

      // Generează un URL semnat, temporar, pentru vizualizarea/descărcarea
      // unui document privat de vânzare.
      async function obtineUrlSemnatVanzare(path) {
        const { data, error } = await supa.storage
          .from(BUCKET_VANZARI)
          .createSignedUrl(path, 300);
        if (error) throw error;
        return data.signedUrl;
      }

      // Leagă click-urile pe orice buton "Vinde produsul" prezent în DOM
      // (marcat cu data-vinde-produs) de modalul de vânzare. Funcție
      // generică, reutilizabilă din orice listă de produse (stocul unui
      // magazin sau produsele "Vânzare directă" din Depozit central) —
      // nu modifică logica de randare/salvare a rândurilor existente.
      function bindVanzareButoane(produse, refresh) {
        document.querySelectorAll("[data-vinde-produs]").forEach((btn) => {
          const produs = (produse || []).find(
            (p) => p.id === btn.getAttribute("data-vinde-produs"),
          );
          if (!produs) return;
          btn.addEventListener("click", () => {
            deschideModalVanzareProdus(produs, refresh);
          });
        });
      }

      // Modal formular pentru vânzarea unui produs către clientul final.
      function deschideModalVanzareProdus(produs, refresh) {
        const overlay = document.createElement("div");
        overlay.id = "vanzare-produs-overlay";
        overlay.className =
          "fixed inset-0 z-40 flex items-center justify-center px-4 py-8 overflow-y-auto";
        overlay.style.background = "rgba(15,20,25,0.55)";
        overlay.innerHTML = `
    <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-lg fade-in my-auto">
      <h2 class="text-lg font-bold mb-1">Vinde produsul ${esc(produs.id_produs)}</h2>
      <p class="text-sm text-slate-500 mb-5">Completează datele clientului final și încarcă documentele obligatorii.</p>
      <form id="form-vanzare-produs" class="space-y-4">
        <div>${fieldLabel("Nume Prenume")}<input type="text" id="vanzare-client-nume" required class="${inputBase()}"></div>
        <div>${fieldLabel("Adresă")}<input type="text" id="vanzare-client-adresa" required class="${inputBase()}"></div>
        <div class="grid grid-cols-2 gap-3">
          <div>${fieldLabel("Telefon")}<input type="text" id="vanzare-client-telefon" required class="${inputBase()}"></div>
          <div>${fieldLabel("Email")}<input type="email" id="vanzare-client-email" required class="${inputBase()}"></div>
        </div>
        <label class="flex items-center gap-2 text-sm font-medium text-slate-700">
          <input type="checkbox" id="vanzare-garantie-extinsa" class="rounded border-slate-300">
          Garanție extinsă
        </label>
        <div>${fieldLabel("Factură")}<input type="file" id="vanzare-file-factura" required accept="application/pdf,image/*" class="${inputBase()} text-slate-600"></div>
        <div>${fieldLabel("P.V. de predare")}<input type="file" id="vanzare-file-pv" required accept="application/pdf,image/*" class="${inputBase()} text-slate-600"></div>
        <div id="vanzare-garantie-file-wrap" class="hidden">${fieldLabel("Garanție extinsă (document)")}<input type="file" id="vanzare-file-garantie" accept="application/pdf,image/*" class="${inputBase()} text-slate-600"></div>
        <div class="flex gap-2 pt-1">
          <button type="button" id="vanzare-produs-cancel" class="flex-1 rounded-lg py-2.5 text-sm font-medium border" style="border-color:var(--line)">Anulează</button>
          <button type="submit" class="flex-1 btn-primary rounded-lg py-2.5 text-sm">Salvează vânzarea</button>
        </div>
        <p id="vanzare-produs-msg" class="text-sm text-center"></p>
      </form>
    </div>`;
        document.body.appendChild(overlay);

        document
          .getElementById("vanzare-produs-cancel")
          .addEventListener("click", () => overlay.remove());
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.remove();
        });

        const garantieCheckbox = document.getElementById(
          "vanzare-garantie-extinsa",
        );
        const garantieFileWrap = document.getElementById(
          "vanzare-garantie-file-wrap",
        );
        garantieCheckbox.addEventListener("change", () => {
          garantieFileWrap.classList.toggle(
            "hidden",
            !garantieCheckbox.checked,
          );
        });

        document
          .getElementById("form-vanzare-produs")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("vanzare-produs-msg");
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const garantieBifata = garantieCheckbox.checked;
            const fileFactura = document.getElementById("vanzare-file-factura")
              .files[0];
            const filePv = document.getElementById("vanzare-file-pv").files[0];
            const fileGarantie = document.getElementById(
              "vanzare-file-garantie",
            ).files[0];

            if (!fileFactura || !filePv) {
              msg.textContent = "Factura și P.V. de predare sunt obligatorii.";
              msg.className = "text-sm text-center text-red-600";
              return;
            }
            if (garantieBifata && !fileGarantie) {
              msg.textContent =
                "Ai bifat Garanție extinsă — încarcă și documentul aferent.";
              msg.className = "text-sm text-center text-red-600";
              return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Se salvează...";
            msg.textContent = "";

            try {
              const facturaPath = await incarcaDocumentVanzare(
                produs.id,
                fileFactura,
                "factura",
              );
              const pvPath = await incarcaDocumentVanzare(
                produs.id,
                filePv,
                "pv_predare",
              );
              const garantiePath = garantieBifata
                ? await incarcaDocumentVanzare(
                    produs.id,
                    fileGarantie,
                    "garantie_extinsa",
                  )
                : null;

              const { error } = await supa
                .from("produse")
                .update({
                  vandut: true,
                  data_vanzare: new Date().toISOString(),
                  vandut_de: currentUser.id,
                  client_nume: document.getElementById("vanzare-client-nume")
                    .value,
                  client_adresa: document.getElementById(
                    "vanzare-client-adresa",
                  ).value,
                  client_telefon: document.getElementById(
                    "vanzare-client-telefon",
                  ).value,
                  client_email: document.getElementById("vanzare-client-email")
                    .value,
                  garantie_extinsa: garantieBifata,
                  factura_url: facturaPath,
                  pv_predare_url: pvPath,
                  garantie_extinsa_url: garantiePath,
                })
                .eq("id", produs.id);
              if (error) throw error;

              toast("Produsul a fost marcat ca vândut.");
              overlay.remove();
              if (typeof refresh === "function") refresh();
            } catch (err) {
              msg.textContent = "Eroare la salvarea vânzării: " + err.message;
              msg.className = "text-sm text-center text-red-600";
              submitBtn.disabled = false;
              submitBtn.textContent = "Salvează vânzarea";
            }
          });
      }

      // Buton pentru deschiderea unui document privat de vânzare
      // într-un tab nou, printr-un URL semnat generat la cerere.
      function bindDeschideDocumenteVanzare(container) {
        container.querySelectorAll("[data-doc-path]").forEach((link) => {
          link.addEventListener("click", async (e) => {
            e.preventDefault();
            const path = link.getAttribute("data-doc-path");
            link.textContent = "Se deschide...";
            try {
              const url = await obtineUrlSemnatVanzare(path);
              window.open(url, "_blank");
            } catch (err) {
              toast("Eroare la deschiderea documentului: " + err.message, true);
            } finally {
              link.textContent = link.getAttribute("data-doc-label");
            }
          });
        });
      }

      function documentLinkHtml(path, label) {
        if (!path) return `<span class="text-slate-300">—</span>`;
        return `<a href="#" data-doc-path="${esc(path)}" data-doc-label="${esc(label)}" class="text-[var(--teal-dark)] underline decoration-dotted">${esc(label)}</a>`;
      }

      function randVanzareHtml(p, nr, magazinLabel) {
        return `
  <tr class="border-b last:border-0 align-top" style="border-color:var(--line)">
    <td class="px-3 py-3 text-slate-400">${nr}</td>
    <td class="px-3 py-3 font-mono text-xs">${esc(p.id_produs)}</td>
    ${magazinLabel !== null ? `<td class="px-3 py-3 text-xs">${esc(magazinLabel)}</td>` : ""}
    <td class="px-3 py-3 text-xs text-slate-500">${p.data_vanzare ? new Date(p.data_vanzare).toLocaleDateString("ro-RO") : "—"}</td>
    <td class="px-3 py-3 text-xs">${esc(p.marca || "—")}</td>
    <td class="px-3 py-3 text-xs">${esc(p.culoare || "—")}</td>
    <td class="px-3 py-3 text-xs font-mono">${esc(p.vin || "—")}</td>
    <td class="px-3 py-3 text-xs">${esc(p.client_nume || "—")}</td>
    <td class="px-3 py-3 text-xs text-slate-500">${esc(p.client_telefon || "—")}</td>
    <td class="px-3 py-3 text-xs text-slate-500">${esc(p.client_email || "—")}</td>
    <td class="px-3 py-3 text-xs text-slate-500">${esc(p.client_adresa || "—")}</td>
    <td class="px-3 py-3 text-xs space-x-2">
      ${documentLinkHtml(p.factura_url, "Factură")}
      ${documentLinkHtml(p.pv_predare_url, "P.V.")}
      ${documentLinkHtml(p.garantie_extinsa_url, "Garanție")}
    </td>
  </tr>`;
      }

      function vanzariTableHtml(produseVandute, magazinLabelFn) {
        if (!produseVandute.length) {
          return `<div class="bg-white rounded-xl border p-10 text-center" style="border-color:var(--line)"><p class="text-slate-400 text-sm">Niciun produs vândut încă.</p></div>`;
        }
        const showMagazinCol = typeof magazinLabelFn === "function";
        return `
    <div class="bg-white rounded-xl border overflow-x-auto" style="border-color:var(--line)">
      <table class="w-full text-sm min-w-[1100px]">
        <thead>
          <tr class="text-left text-slate-500 border-b" style="border-color:var(--line)">
            <th class="px-3 py-3 font-medium">Nr.</th>
            <th class="px-3 py-3 font-medium">ID produs</th>
            ${showMagazinCol ? '<th class="px-3 py-3 font-medium">Magazin</th>' : ""}
            <th class="px-3 py-3 font-medium">Data vânzării</th>
            <th class="px-3 py-3 font-medium">Marcă</th>
            <th class="px-3 py-3 font-medium">Culoare</th>
            <th class="px-3 py-3 font-medium">VIN</th>
            <th class="px-3 py-3 font-medium">Client</th>
            <th class="px-3 py-3 font-medium">Telefon</th>
            <th class="px-3 py-3 font-medium">Email</th>
            <th class="px-3 py-3 font-medium">Adresă</th>
            <th class="px-3 py-3 font-medium">Documente</th>
          </tr>
        </thead>
        <tbody>
          ${produseVandute
            .map((p, i) =>
              randVanzareHtml(
                p,
                i + 1,
                showMagazinCol ? magazinLabelFn(p) : null,
              ),
            )
            .join("")}
        </tbody>
      </table>
    </div>`;
      }

      // Dispatcher tab "Produse vândute" — comportament diferit per rol.
      function renderVanduteTab(container) {
        if (currentProfile.role === "magazin")
          return renderVanduteMagazin(container);
        return renderVanduteAdmin(container);
      }

      // Magazin: doar propriile vânzări (fără coloana Magazin — gestionează
      // doar produsele proprii).
      async function renderVanduteMagazin(container) {
        container.innerHTML = `<div class="text-sm text-slate-400">Se încarcă...</div>`;
        const { data: produse, error } = await supa
          .from("produse")
          .select("*")
          .eq("magazin_id", currentUser.id)
          .eq("vandut", true)
          .order("data_vanzare", { ascending: false });
        if (error) {
          container.innerHTML = `<div class="text-red-600 text-sm">Eroare: ${esc(error.message)}</div>`;
          return;
        }
        container.innerHTML = `
    <p class="text-sm text-slate-500 mb-4">${(produse || []).length} produs${(produse || []).length === 1 ? "" : "e"} vândut${(produse || []).length === 1 ? "" : "e"}</p>
    ${vanzariTableHtml(produse || [], null)}`;
        bindDeschideDocumenteVanzare(container);
      }

      // Admin / Superadmin: toate vânzările — din toate magazinele plus
      // vânzările directe proprii.
      async function renderVanduteAdmin(container) {
        container.innerHTML = `<div class="text-sm text-slate-400">Se încarcă...</div>`;
        const [
          { data: produse, error: prodErr },
          { data: profiles, error: profErr },
        ] = await Promise.all([
          supa
            .from("produse")
            .select("*")
            .eq("vandut", true)
            .order("data_vanzare", { ascending: false }),
          supa.from("profiles").select("*"),
        ]);
        if (prodErr || profErr) {
          const e = prodErr || profErr;
          container.innerHTML = `<div class="text-red-600 text-sm">Eroare: ${esc(e.message)}</div>`;
          return;
        }
        const magazine = (profiles || []).filter((p) => p.role === "magazin");
        const magazinLabelFn = (p) => {
          if (p.vanzare_directa) return "Vânzare directă";
          const m = magazine.find((x) => x.id === p.magazin_id);
          return m
            ? `${m.nume || m.email}${m.filiala ? " - " + m.filiala : ""}`
            : "—";
        };
        container.innerHTML = `
    <p class="text-sm text-slate-500 mb-4">${(produse || []).length} produs${(produse || []).length === 1 ? "" : "e"} vândut${(produse || []).length === 1 ? "" : "e"} în total</p>
    ${vanzariTableHtml(produse || [], magazinLabelFn)}`;
        bindDeschideDocumenteVanzare(container);
      }
    </script>
  </body>
</html>
